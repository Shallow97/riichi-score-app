<!DOCTYPE html>
<!-- 场风盘推送页（独立页面，不在 APP 界面内，不影响任何测试断言）
     用法（房主手机 Chrome）：http://127.0.0.1:8765/tag.html
     预览模式（电脑浏览器即可看版式，无需蓝牙）：tag.html?demo=1
     蓝牙推送页源码协议来自 tsl0922/EPD-nRF5（开源），详见 js/tagpush.js 头注释
     布局（用户定稿 2026-09-30）：
       - 屏中间：局号（东1局）/ 本场数（0本场）/ 场供（场供1000，实际点数）
       - 屏四边：每边一位玩家 = 风位（东红其余黑）+ 分数 + 立直显示区（立直棒中心红点）
       - 边位跟玩家静态座位（seat）绑定，开局定死：四人 东下/南右/西上/北左（逆时针）；
         三人（座位东南西）东下/南右/西左，上方固定留空
       - 红色"东"（庄家）随轮庄在四边迁移，起始在下方 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>场风盘 · e-ink 推送</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f0f0f0; padding: 12px; }
  h1 { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
  #board { width: 100%; max-width: 600px; display: block; background: #fff;
           border: 1px solid #999; image-rendering: pixelated; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  button { padding: 8px 14px; font-size: 14px; border: 1px solid #888; background: #fff; border-radius: 6px; }
  button:disabled { color: #aaa; }
  #status { font-size: 13px; color: #333; }
  #log { font-size: 12px; background: #fff; border: 1px solid #ccc; padding: 6px;
         max-height: 140px; overflow-y: auto; white-space: pre-wrap; color: #444; }
  label { font-size: 13px; }
</style>
</head>
<body>
<h1>场风盘 · e-ink 推送（4.2寸三色 400×300）</h1>
<canvas id="board" width="400" height="300"></canvas>
<div class="row">
  <button id="btn-ble">连接蓝牙</button>
  <button id="btn-push" disabled>立即推送</button>
  <label><input type="checkbox" id="opt-rot"> 竖屏推送（旋转90°）</label>
  <label><input type="checkbox" id="opt-auto" checked> 收到结算自动推送</label>
</div>
<div class="row">
  <span id="status">未连接</span>
</div>
<div id="log"></div>
<script src="js/tagpush.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var logEl = document.getElementById('log');
  var statusEl = document.getElementById('status');
  var btnBle = document.getElementById('btn-ble');
  var btnPush = document.getElementById('btn-push');
  var optAuto = document.getElementById('opt-auto');
  var optRot = document.getElementById('opt-rot');
  var BLACK = '#000000', RED = '#ff0000', WHITE = '#ffffff';
  var lastKey = '';
  var currentGame = null;

  function log(msg) {
    var t = new Date();
    var ts = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
    logEl.textContent += '[' + ts + '] ' + msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setStatus(s) { statusEl.textContent = s; }

  /* ---------------- 渲染（画布即最终屏显，颜色只用纯黑/纯红/纯白） ---------------- */

  function fmt(n) { return n.toLocaleString('en-US'); }

  /* 边位映射：按键是玩家静态座位（rules.js：seat 固定不变，wind 随换庄旋转）。
     rect=[x,y,w,h]（屏幕坐标），angle=该边文字朝向（面向自己的座位）。
     四人：东下/南右/西上/北左；三人（座位东南西）：东下/南右/西左，上留空。 */
  var EDGE_4 = {
    '东': { rect: [0, 220, 400, 80], angle: 0 },
    '南': { rect: [300, 80, 100, 140], angle: -Math.PI / 2 },
    '西': { rect: [0, 0, 400, 80], angle: Math.PI },
    '北': { rect: [0, 80, 100, 140], angle: Math.PI / 2 },
  };
  var EDGE_3 = {
    '东': { rect: [0, 220, 400, 80], angle: 0 },
    '南': { rect: [300, 80, 100, 140], angle: -Math.PI / 2 },
    '西': { rect: [0, 80, 100, 140], angle: Math.PI / 2 },
  };

  function stickPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawEdge(p, rect, angle) {
    var w = rect[2], h = rect[3];
    var wide = (angle === 0 || Math.abs(angle) > 2); // 上下长边 / 左右短边
    var L = wide ? w : h, H = wide ? h : w;          // 本地坐标：L=阅读方向宽，H=竖直高
    ctx.save();
    ctx.translate(rect[0] + w / 2, rect[1] + h / 2);
    ctx.rotate(angle);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    var windSize = wide ? 46 : 38, scoreSize = wide ? 34 : 26;
    // 风位大字（当前风位，东红其余黑）
    ctx.fillStyle = (p.wind === '东') ? RED : BLACK;
    ctx.font = 'bold ' + windSize + 'px sans-serif';
    ctx.fillText(p.wind, -L / 2 + 12, -H / 2 + windSize + 8);
    // 分数（右对齐，负分红）
    ctx.fillStyle = p.points < 0 ? RED : BLACK;
    ctx.font = 'bold ' + scoreSize + 'px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(fmt(p.points), L / 2 - 12, -H / 2 + scoreSize + 12);
    ctx.textAlign = 'left';
    // 立直显示区：立直棒（白身黑框、中心红点）；>2 根画 2 根 + ×N
    if (p.riichiBars > 0) {
      var n = p.riichiBars, sw = 56, sh = 14, gap = 10, cy = H / 2 - 20;
      // 长边最多画 3 根，短边最多 1 根；超出上限画满上限再标 ×N
      var shown, label = '';
      if (n > (wide ? 3 : 2)) { shown = wide ? 2 : 1; label = '×' + n; }
      else { shown = n; }
      var total = shown * sw + (shown - 1) * gap + (label ? 6 + 20 : 0);
      var sx = -total / 2;
      for (var s = 0; s < shown; s++) {
        var x = sx + s * (sw + gap);
        ctx.fillStyle = WHITE;
        stickPath(x, cy - sh / 2, sw, sh, sh / 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = BLACK;
        ctx.stroke();
        ctx.fillStyle = RED;
        ctx.beginPath();
        ctx.arc(x + sw / 2, cy, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (label) {
        ctx.fillStyle = BLACK;
        ctx.font = 'bold 18px sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, sx + shown * (sw + gap) + 6, cy);
        ctx.textBaseline = 'alphabetic';
      }
    }
    ctx.restore();
  }

  function render(game) {
    currentGame = game;
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, 400, 300);
    if (!game) return;

    // 四边（按静态座位入座；三人局上方固定留空）
    var layout = game.mode === 3 ? EDGE_3 : EDGE_4;
    var players = game.players || [];
    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      var lay = layout[p.seat];
      if (lay) drawEdge(p, lay.rect, lay.angle);
    }

    // 中间信息板
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 3;
    ctx.strokeRect(101.5, 81.5, 197, 137);
    ctx.fillStyle = BLACK;
    ctx.textAlign = 'center';
    if (game.over) {
      ctx.font = 'bold 52px sans-serif';
      ctx.fillText('终局', 200, 150);
      ctx.font = '24px sans-serif';
      ctx.fillText((game.endReason || '').slice(0, 12), 200, 195);
    } else {
      ctx.font = 'bold 48px sans-serif';
      ctx.fillText(game.round.wind + game.round.num + '局', 200, 148);
      var sHonba = game.honba + '本场';
      var sKyotaku = game.kyotaku > 0 ? ('场供' + game.kyotaku) : '';
      ctx.font = '26px sans-serif';
      var w1 = ctx.measureText(sHonba).width;
      var w2 = sKyotaku ? ctx.measureText(sKyotaku).width + 18 : 0;
      if (w1 + w2 > 190) { ctx.font = '22px sans-serif'; w1 = ctx.measureText(sHonba).width; w2 = sKyotaku ? ctx.measureText(sKyotaku).width + 14 : 0; }
      var sx = 200 - (w1 + w2) / 2;
      ctx.textAlign = 'left';
      ctx.fillStyle = BLACK;
      ctx.fillText(sHonba, sx, 196);
      if (sKyotaku) { ctx.fillStyle = RED; ctx.fillText(sKyotaku, sx + w1 + 18, 196); }
      ctx.textAlign = 'center';
    }
    ctx.textAlign = 'left';
    lastKey = stateKey(game);
  }

  function stateKey(g) {
    if (!g) return '';
    return g.round.wind + g.round.num + '|' + g.honba + '|' + g.kyotaku + '|' + g.over + '|' +
      (g.players || []).map(function (p) {
        return [p.wind, p.points, p.riichiBars, p.name].join(',');
      }).join('|');
  }

  /* ---------------- 事件 ---------------- */

  btnBle.addEventListener('click', async function () {
    btnBle.disabled = true;
    try {
      var ok = await TagPush.connect();
      btnPush.disabled = !ok;
      btnBle.disabled = false;
      if (ok) log('蓝牙已连接，等待结算广播…');
    } catch (e) {
      log('连接失败: ' + (e && e.message ? e.message : e));
      btnBle.disabled = false;
    }
  });

  btnPush.addEventListener('click', async function () {
    if (!currentGame) { log('还没有画面数据'); return; }
    try {
      await TagPush.pushCanvas(canvas, optRot.checked);
    } catch (e) {
      log('推送失败: ' + (e && e.message ? e.message : e));
    }
  });

  async function maybeAutoPush(game) {
    if (!optAuto.checked) return;
    var k = stateKey(game);
    if (k === lastPushedKey) return;
    lastPushedKey = k;
    if (!TagPush.state.connected) { log('（蓝牙未连接，跳过自动推送）'); return; }
    log('检测到结算变化，自动推送…');
    try { await TagPush.pushCanvas(canvas, optRot.checked); }
    catch (e) { log('自动推送失败: ' + (e && e.message ? e.message : e)); }
  }
  var lastPushedKey = '';

  /* ---------------- 启动 ---------------- */

  TagPush_listen();
  function TagPush_listen() {
    TagPush.listenState(
      function (stateStr) {
        var game = null;
        try { game = (typeof stateStr === 'string') ? JSON.parse(stateStr) : stateStr; } catch (e) { return; }
        render(game);
        maybeAutoPush(game);
      },
      function (s) {
        if (s === 'connected') log('已连接对局服务器（只听模式）');
      }
    );
  }

  window.addEventListener('error', function (e) { window.__err = e.message; });

  var params = new URLSearchParams(location.search);
  if (params.has('demo')) {
    render(DEMO_GAME());
    document.getElementById('board').__rendered = true;
    log('演示模式：显示假数据，不出现在真实对局中');
  } else {
    log('等待对局服务器 state 广播…（无画面为正常，开局后自动出现）');
  }

  /* 演示数据：东2局（庄家已轮转一次）——红色"东"应出现在右边（座位南），
     展示 1 根 / 2 根 / ×3 三种立直棒画法；分数总和+场供=100000 */
  function DEMO_GAME() {
    return {
      mode: 4,
      players: [
        { seat: '东', wind: '北', name: '小立', points: 25100, riichi: false, riichiBars: 1 },
        { seat: '南', wind: '东', name: '阿茂', points: 32400, riichi: true, riichiBars: 3 },
        { seat: '西', wind: '南', name: '豆沙包', points: 33300, riichi: false, riichiBars: 0 },
        { seat: '北', wind: '西', name: '小鱼', points: 8200, riichi: true, riichiBars: 2 },
      ],
      opts: { westRule: false, multiRon: false, dealerName: '阿茂' },
      dealerIndex: 1,
      round: { wind: '东', num: 2 },
      honba: 1,
      kyotaku: 1000,
      gameWind: '东',
      over: false,
      endReason: '',
      history: [],
    };
  }
})();
</script>
</body>
</html>
