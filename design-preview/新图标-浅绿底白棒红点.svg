<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360">
  <rect width="620" height="360" fill="#f4f7f4"/>
  <text x="40" y="40" font-family="sans-serif" font-size="15" fill="#2e7d52" font-weight="600">最终图标确认：浅绿底 + 白色立直棒（灰描边）+ 红点</text>

  <!-- 方形（启动器效果） -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="250" height="250" rx="28" fill="#FFFFFF" stroke="#d8deda" stroke-width="1"/>
    <g transform="translate(125,125)">
      <path d="M6,28 a22,22 0 0 1 22,-22 h52 a22,22 0 0 1 22,22 v52 a22,22 0 0 1 -22,22 h-52 a22,22 0 0 1 -22,-22 z" fill="#9ED2A6"/>
      <rect x="-30" y="-8" width="60" height="16" rx="8" fill="#FFFFFF" stroke="#9aa5a7" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#e53935"/>
    </g>
    <text x="125" y="292" font-family="sans-serif" font-size="13" fill="#555" text-anchor="middle">方形（实际启动器）效果</text>
  </g>

  <!-- 圆形裁剪效果 -->
  <g transform="translate(330,80)">
    <circle cx="125" cy="125" r="125" fill="#f2f7f2" stroke="#d8deda" stroke-width="1"/>
    <clipPath id="cir"><circle cx="125" cy="125" r="125"/></clipPath>
    <g clip-path="url(#cir)">
      <rect x="-10" y="-10" width="270" height="270" fill="#9ED2A6"/>
      <rect x="95" y="117" width="60" height="16" rx="8" fill="#FFFFFF" stroke="#9aa5a7" stroke-width="2"/>
      <circle cx="125" cy="125" r="7" fill="#e53935"/>
    </g>
    <text x="125" y="292" font-family="sans-serif" font-size="13" fill="#555" text-anchor="middle">圆形裁剪效果</text>
  </g>

  <text x="500" y="120" font-family="sans-serif" font-size="13" fill="#333">参考：程序内 .riichi-stick</text>
  <g transform="translate(500,140)">
    <rect x="0" y="0" width="120" height="76" rx="10" fill="#fff" stroke="#e0e5e2"/>
    <rect x="10" y="24" width="44" height="6" rx="3" fill="#ffffff" stroke="#9aa5a7"/>
    <circle cx="36" cy="27" r="2.5" fill="#e53935"/>
    <text x="76" y="26" font-family="monospace" font-size="11" fill="#888">44×6 白条</text>
    <text x="76" y="44" font-family="monospace" font-size="11" fill="#888">描边 #9aa5a7</text>
    <text x="76" y="62" font-family="monospace" font-size="11" fill="#e53935">红点 #e53935</text>
  </g>
</svg>
